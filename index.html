<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduAdapt - Plataforma Educacional</title>
  
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- Lucide Icons (Biblioteca de Ícones) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ================= TELA DE LOGIN / CADASTRO ================= -->
  <div id="auth-card" class="auth-card">
    
    <div class="auth-header">
      <span class="badge-simulation">Simulação Front-End</span>
      <h1 class="brand-title">EduAdapt</h1>
      <p id="auth-subtitle" class="auth-subtitle">Acesse sua conta para continuar</p>
    </div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)">
      
      <!-- Campo Nome Completo (Oculto no Login) -->
      <div id="group-name" class="form-group hidden">
        <label class="form-label">Nome Completo</label>
        <div class="input-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input
            type="text"
            id="input-name"
            placeholder="Seu nome completo"
            class="form-input"
          />
        </div>
      </div>

      <!-- Campo E-mail -->
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input
            type="email"
            id="input-email"
            required
            placeholder="seu@email.com"
            value="aluno@eduadapt.com"
            class="form-input"
          />
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label class="form-label">Senha</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input
            type="password"
            id="input-password"
            required
            placeholder="••••••••"
            value="123456"
            class="form-input"
          />
        </div>
      </div>

      <!-- Botão de Ação CTA -->
      <button type="submit" class="btn-cta">
        <span id="btn-submit-text">Simular Entrar</span>
        <i data-lucide="arrow-right" style="width: 1rem; height: 1rem;"></i>
      </button>
    </form>

    <div class="toggle-wrapper">
      <span id="toggle-label">Ainda não tem uma conta?</span>
      <button type="button" onclick="toggleMode()" id="toggle-btn" class="btn-toggle">
        Cadastre-se
      </button>
    </div>
  </div>


  <!-- ================= TELA DE DASHBOARD ================= -->
  <div id="dashboard-screen" class="dashboard-screen hidden">
    <!-- Navbar -->
    <header class="navbar">
      <div class="navbar-brand">
        <div class="brand-badge">EduAdapt</div>
      </div>
      <div class="navbar-user">
        <span id="user-display-name" style="font-size: 0.875rem; font-weight: 500;">Estudante</span>
        <button onclick="logout()" class="btn-logout">
          <i data-lucide="log-out" style="width: 0.875rem; height: 0.875rem;"></i>
          <span>Sair</span>
        </button>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="dashboard-content">
      <div class="welcome-card">
        <h2 id="welcome-heading">Bem-vindo(a)!</h2>
        <p>Este é o seu painel de aprendizado na plataforma EduAdapt.</p>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-icon blue">
            <i data-lucide="book-open"></i>
          </div>
          <div>
            <p class="metric-title">Módulos Concluídos</p>
            <p class="metric-value">4 / 12</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon green">
            <i data-lucide="trophy"></i>
          </div>
          <div>
            <p class="metric-title">Pontuação Total</p>
            <p class="metric-value">1.250 pts</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon orange">
            <i data-lucide="layout-dashboard"></i>
          </div>
          <div>
            <p class="metric-title">Nível Atual</p>
            <p class="metric-value">Intermediário</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript Personalizado -->
  <script src="script.js"></script>
</body>
</html>
