<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educação Adaptável - Plataforma Educacional Inclusiva</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#2e7d32',
              greenLight: '#e8f5e9',
              greenDark: '#1b5e20',
              orangeSoft: '#fff3e0',
              orangeAccent: '#f57c00',
              blueSoft: '#e3f2fd',
              blueAccent: '#0288d1',
              surface: '#f8fafc',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & OpenDyslexic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic.css">

  <!-- Estilos Customizados Separados -->
  <link rel="stylesheet" href="styles.css">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-brand-surface text-slate-800 antialiased selection:bg-brand-greenLight selection:text-brand-greenDark">

  <!-- Ponto de Montagem da Aplicação React -->
  <div id="root"></div>

  <!-- Lógica React/JS Separada -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
